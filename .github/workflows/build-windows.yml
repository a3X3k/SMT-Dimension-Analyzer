name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm SMT_Dimension_Analyzer.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/SMT_Dimension_Analyzer.exe')) { throw 'EXE not produced' }
          Get-Item 'dist/SMT_Dimension_Analyzer.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/SMT_Dimension_Analyzer.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SMT-Dimension-Analyzer-Windows-x64
          path: dist/SMT_Dimension_Analyzer.exe
          if-no-files-found: error
